<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - AI Prompt Governance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div th:replace="fragments/layout :: sidebar"></div>

        <!-- Page Content -->
        <div id="page-content-wrapper">
            <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm">
                <div class="container-fluid">
                    <button class="btn btn-outline-secondary btn-sm" id="sidebarToggle">
                        <i class="bi bi-list"></i>
                    </button>
                    <span class="navbar-text ms-auto">
                        <i class="bi bi-person-circle me-1"></i>
                        <span sec:authentication="name">User</span>
                    </span>
                </div>
            </nav>

            <div class="container-fluid p-4">
                <!-- Page Header -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="mb-0"><i class="bi bi-speedometer2 me-2"></i>Dashboard</h4>
                    <a th:href="@{/prompts/new}" class="btn btn-primary">
                        <i class="bi bi-plus-circle me-1"></i> New Prompt
                    </a>
                </div>

                <!-- Alert Messages -->
                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle me-2"></i>
                    <span th:text="${successMessage}">Success</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <!-- Stats Cards -->
                <div class="row g-4 mb-4">
                    <div class="col-md-3">
                        <div class="card border-0 shadow-sm stat-card stat-card-total">
                            <div class="card-body text-center p-3">
                                <div class="stat-icon">
                                    <i class="bi bi-chat-dots"></i>
                                </div>
                                <h2 class="mb-1" th:text="${totalPrompts}">0</h2>
                                <p class="text-muted mb-0">Total Prompts</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card border-0 shadow-sm stat-card stat-card-safe">
                            <div class="card-body text-center p-3">
                                <div class="stat-icon">
                                    <i class="bi bi-shield-check"></i>
                                </div>
                                <h2 class="mb-1" th:text="${safePrompts}">0</h2>
                                <p class="text-muted mb-0">Safe Prompts</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card border-0 shadow-sm stat-card stat-card-risk">
                            <div class="card-body text-center p-3">
                                <div class="stat-icon">
                                    <i class="bi bi-exclamation-triangle"></i>
                                </div>
                                <h2 class="mb-1" th:text="${highRiskPrompts}">0</h2>
                                <p class="text-muted mb-0">High Risk Prompts</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card border-0 shadow-sm stat-card stat-card-improved">
                            <div class="card-body text-center p-3">
                                <div class="stat-icon">
                                    <i class="bi bi-stars"></i>
                                </div>
                                <h2 class="mb-1" th:text="${improvedPrompts}">0</h2>
                                <p class="text-muted mb-0">AI Improved</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Recent Prompts -->
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white py-3">
                        <h5 class="mb-0"><i class="bi bi-clock-history me-2"></i>Recent Prompt History</h5>
                    </div>
                    <div class="card-body p-0">
                        <div th:if="${#lists.isEmpty(recentPrompts)}" class="text-center py-5">
                            <i class="bi bi-inbox text-muted" style="font-size: 3rem;"></i>
                            <p class="text-muted mt-2">No prompts yet. Create your first prompt!</p>
                            <a th:href="@{/prompts/new}" class="btn btn-primary">
                                <i class="bi bi-plus-circle me-1"></i> Create Prompt
                            </a>
                        </div>
                        <div th:unless="${#lists.isEmpty(recentPrompts)}">
                            <div class="table-responsive">
                                <table class="table table-hover mb-0">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Title</th>
                                            <th>Category</th>
                                            <th>Status</th>
                                            <th>Date</th>
                                            <th>Action</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="prompt : ${recentPrompts}">
                                            <td>
                                                <a th:href="@{/prompts/view/{id}(id=${prompt.id})}" class="text-decoration-none fw-medium" th:text="${prompt.title}">Title</a>
                                            </td>
                                            <td><span class="badge bg-info" th:text="${prompt.category}">Category</span></td>
                                            <td>
                                                <span th:if="${prompt.status == 'SAFE'}" class="badge bg-success">Safe</span>
                                                <span th:if="${prompt.status == 'MEDIUM'}" class="badge bg-warning text-dark">Medium</span>
                                                <span th:if="${prompt.status == 'HIGH'}" class="badge bg-danger">High</span>
                                                <span th:if="${prompt.status == 'PENDING'}" class="badge bg-secondary">Pending</span>
                                            </td>
                                            <td class="text-muted small" th:text="${#temporals.format(prompt.createdDate, 'yyyy-MM-dd HH:mm')}">Date</td>
                                            <td>
                                                <a th:href="@{/prompts/view/{id}(id=${prompt.id})}" class="btn btn-sm btn-outline-primary">
                                                    <i class="bi bi-eye"></i>
                                                </a>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
