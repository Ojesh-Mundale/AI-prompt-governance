<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${prompt.id != null} ? 'Edit Prompt' : 'New Prompt'">Prompt Form - AI Prompt Governance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="d-flex" id="wrapper">
        <div th:replace="fragments/layout :: sidebar"></div>

        <div id="page-content-wrapper">
            <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm">
                <div class="container-fluid">
                    <button class="btn btn-outline-secondary btn-sm" id="sidebarToggle">
                        <i class="bi bi-list"></i>
                    </button>
                    <span class="navbar-text ms-auto">
                        <i class="bi bi-person-circle me-1"></i>
                        <span sec:authentication="name">User</span>
                    </span>
                </div>
            </nav>

            <div class="container-fluid p-4">
                <!-- Page Header -->
                <div class="mb-4">
                    <h4 class="mb-0">
                        <i class="bi bi-plus-circle me-2" th:if="${prompt.id == null}"></i>
                        <i class="bi bi-pencil me-2" th:if="${prompt.id != null}"></i>
                        <span th:text="${prompt.id != null} ? 'Edit Prompt' : 'New Prompt'">Prompt Form</span>
                    </h4>
                </div>

                <!-- Form Card -->
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <form th:action="${prompt.id != null} ? @{/prompts/edit/{id}(id=${prompt.id})} : @{/prompts/new}"
                              method="post" th:object="${prompt}">
                            <div class="mb-3">
                                <label for="title" class="form-label">Title <span class="text-danger">*</span></label>
                                <input type="text" id="title" th:field="*{title}" class="form-control" placeholder="Enter a descriptive title for your prompt">
                                <div th:if="${#fields.hasErrors('title')}" class="text-danger small mt-1">
                                    <span th:errors="*{title}">Title error</span>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="category" class="form-label">Category <span class="text-danger">*</span></label>
                                <select id="category" th:field="*{category}" class="form-select">
                                    <option value="">-- Select Category --</option>
                                    <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}">Category</option>
                                </select>
                                <div th:if="${#fields.hasErrors('category')}" class="text-danger small mt-1">
                                    <span th:errors="*{category}">Category error</span>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="promptText" class="form-label">Prompt Text <span class="text-danger">*</span></label>
                                <textarea id="promptText" th:field="*{promptText}" class="form-control" rows="8" placeholder="Enter your AI prompt here..."></textarea>
                                <div class="form-text">Be specific and detailed for better AI responses.</div>
                                <div th:if="${#fields.hasErrors('promptText')}" class="text-danger small mt-1">
                                    <span th:errors="*{promptText}">Prompt text error</span>
                                </div>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary px-4">
                                    <i class="bi bi-check-lg me-1"></i>
                                    <span th:text="${prompt.id != null} ? 'Update Prompt' : 'Save Prompt'">Save</span>
                                </button>
                                <a th:href="@{/prompts}" class="btn btn-outline-secondary px-4">
                                    <i class="bi bi-x-lg me-1"></i> Cancel
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
