# ============================================================
# Application Configuration
# ============================================================
spring.application.name=ai-prompt-governance

# ============================================================
# Server Configuration
# ============================================================
server.port=8080
server.servlet.context-path=/

# ============================================================
# MySQL Database Configuration
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/ai_prompt_governance?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Ojesh@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA / Hibernate Configuration
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================================================
# Thymeleaf Configuration
# ============================================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=true



# ============================================================
# Ollama API Configuration (optional - set key to use AI Improver)
# ============================================================
ollama.api.url=http://localhost:11434/api/generate 
ollama.api.model=llama3
# ============================================================
# Logging Configuration
# ============================================================
logging.level.root=INFO
logging.level.com.ai.prompt.governance=DEBUG
logging.file.name=./logs/application.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n